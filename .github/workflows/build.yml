name: Build TuckNote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Test and build frontend
        working-directory: client
        run: |
          pnpm test
          pnpm build

      - name: Test backend
        run: dotnet test .\Tucknote.slnx -c Release --nologo

      - name: Publish web application
        if: github.event_name != 'pull_request'
        run: dotnet publish .\Tucknote\Tucknote.csproj -c Release -o .\publish --nologo

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tucknote-windows
          path: publish/
          retention-days: 7

